        const ANSWER_TOGGLE = `<div class="wp-answer-toggle wp-no-export" contenteditable="false" onclick="var n=this.parentElement.querySelector('.wp-answer');if(n)n.style.display=(n.style.display==='none'?'block':'none');">👁 显示 / 隐藏答案</div>` + BOARD_EXPORT_BAR_HTML;

        // ---------- 试题 1：看拼音写汉字 ----------
        function buildWritePinyinHtml(items) {
            let html = `<div class="wp-exam">`;
            html += `<h2>✍️ 看拼音，写汉字 (Write the Characters)</h2>`;
            html += `<div class="wp-tip">Write the Chinese characters for the pinyin in the boxes. The English in brackets tells you the meaning.</div>`;
            const answers = [];

            items.forEach((it, idx) => {
                const chars = it.sentence.split('');
                const py = getPinyinArray(it.sentence);
                const flags = new Array(chars.length).fill(false);
                const enAfter = {};
                let cursor = 0;
                const ans = [];
                it.blanks.forEach(b => {
                    let p = it.sentence.indexOf(b.text, cursor);
                    if (p === -1) p = it.sentence.indexOf(b.text);
                    if (p === -1) return;
                    for (let k = p; k < p + b.text.length; k++) flags[k] = true;
                    enAfter[p + b.text.length - 1] = b.en;
                    cursor = p + b.text.length;
                    ans.push(b.text);
                });
                answers.push(`${idx + 1}. ${ans.join('、')}`);

                let line = '';
                chars.forEach((ch, i) => {
                    if (flags[i]) {
                        line += `<span class="wp-cell wp-blank"><span class="wp-py">${escapeHtml(py[i] || '')}</span><span class="wp-zi">&nbsp;</span></span>`;
                    } else {
                        line += `<span class="wp-cell"><span class="wp-py">${escapeHtml(py[i] || '')}</span><span class="wp-zi">${escapeHtml(ch)}</span></span>`;
                    }
                    if (enAfter[i] !== undefined) {
                        line += `<span class="wp-en">(${escapeHtml(enAfter[i])})</span>`;
                    }
                });
                html += `<div class="wp-item"><span class="wp-no">${idx + 1}.</span><div class="wp-line">${line}</div></div>`;
            });

            html += ANSWER_TOGGLE;
            html += `<div class="wp-answer" style="display:none;">参考答案：<br>${answers.map(escapeHtml).join('<br>')}</div>`;

{"items":[{"sentence":"我喜欢喝茶。","blanks":[{"text":"喜欢","en":"to like"}]}]}`;

                    const raw = await callAI(prompt, '你是一个专业的国际中文命题专家。只输出 JSON。', null, false);

        // ---------- 试题 2：补全汉字（选部件，支持简体、繁体及繁简混合，给出词汇能拆解的都出题） ----------

            '井面写学觉举兴国园图医区匹气风习为无与乐药几机龙龟齿齐黄黑默党两农军里丧哀衰衷办辨辩辞乱郁吁盐艳观欢权劝罐灌鹤鹰' +

        // 拦截单笔画、零碎笔形、冷僻部件以及字体容易显示不全的变形偏旁
        const BAD_FRAGMENTS = new Set([

            '士','夂','夊','夕','尢','尸','屮','工','己','巾','干','幺','广','廴','廾','弋','弓','彐','彡','彳','龶','龸',

        function isValidRadicalSplit(o) {
            if (!o) return false;
            const chars = Array.from(o.word);
            const ch = chars[o.idx];
            if (!ch || BAD_SPLIT_CHARS.has(ch)) return false;
            if (o.visible === ch || o.missing === ch || o.visible === o.missing) return false;
            if (BAD_FRAGMENTS.has(o.visible) || BAD_FRAGMENTS.has(o.missing)) return false;
            if (Array.from(o.visible).length !== 1 || Array.from(o.missing).length !== 1) return false;
            if (KNOWN_BAD_PAIRS[ch] && (KNOWN_BAD_PAIRS[ch].includes(o.missing) || KNOWN_BAD_PAIRS[ch].includes(o.visible))) return false;
            if (ch === '站' && o.missing === '佔') return false;
            // 简体「点」不能用繁体部件「黑」；繁体「點」不能用简体部件「灬」
            if (ch === '点' && (o.visible === '黑' || o.missing === '黑')) return false;
            if (ch === '點' && (o.visible === '灬' || o.missing === '灬')) return false;
            return true;
        }

        function normRadicalItem(o) {
            if (!o) return null;
            const word = String(o.word || '').trim();
            const ch = String(o.char || '').trim();
            const visible = String(o.visible || '').trim();
            const missing = String(o.missing || '').trim();
            if (!word || !ch || !visible || !missing) return null;
            const idx = Array.from(word).indexOf(Array.from(ch)[0]);
            if (idx < 0) return null;
            const item = { word, idx, visible, missing, position: String(o.position || 'natural').trim(), en: String(o.en || '').trim() };
            return isValidRadicalSplit(item) ? item : null;
        }

        // ================= 繁簡轉換（OpenCC-js，按需載入） =================

                'https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js'
            ];
            openccPromise = (async () => {
                for (const u of urls) {
                    const ok = await new Promise(res => {
                        const s = document.createElement('script');
                        s.src = u;
                        s.onload = () => res(!!window.OpenCC);
                        s.onerror = () => res(false);
                        document.head.appendChild(s);
                    });
                    if (ok) return true;
                }
                return false;
            })();

        async function convertBoard(mode) {

            let range = null;
            const sel = window.getSelection();
            if (sel && sel.rangeCount && !sel.isCollapsed) {
                const r = sel.getRangeAt(0);
                if (whiteboard.contains(r.commonAncestorContainer)) range = r.cloneRange();
            }
            if (!range && !confirm('未選中文字，將轉換整個白板的內容。\n（拼音、圖片、格式不受影響，可通過「撤銷」恢復）\n\n是否繼續？')) return;

            const ok = await ensureOpenCC();
            if (!ok) { alert('繁簡轉換組件載入失敗，請檢查網絡（需能訪問 cdn.jsdelivr.net 或 unpkg.com）後重試。'); return; }
            const conv = getConverter(mode);

            saveHistoryImmediate();
            let changed = 0;

            if (range) {
                getRangeTextParts(range).forEach(p => {
                    const el = p.node.parentElement;
                    if (!el || el.closest('rt, .py-top')) return;
                    const v = p.node.nodeValue;
                    const nv = v.slice(0, p.s) + conv(v.slice(p.s, p.e)) + v.slice(p.e);
                    if (nv !== v) { p.node.nodeValue = nv; changed++; }
                });
            } else {
                const walker = document.createTreeWalker(whiteboard, NodeFilter.SHOW_TEXT);
                const nodes = [];
                let n;
                while ((n = walker.nextNode())) {
                    const el = n.parentElement;
                    if (el && el.closest('rt, .py-top')) continue;
                    nodes.push(n);
                }
                nodes.forEach(t => {
                    const v = t.nodeValue;
                    const nv = conv(v);
                    if (nv !== v) { t.nodeValue = nv; changed++; }
                });
            }

            saveHistoryImmediate();
            setTimeout(resizeCanvas, 100);
            if (!changed) alert(mode === 's2t' ? '沒有需要轉換的簡體字。' : '沒有需要轉換的繁體字。');
        }

                        : `【本次考查词汇】用户没有指定，请从课文语料中找出所有包含「偏旁部首、左右结构、上下结构或清晰半包围结构」易拆解汉字的词语（不限制题数，原样保留课文里的简体或繁体字形），能拆解的都做成试题。`;

                    const prompt = `你是一位严谨的国际中文教师，要出一份 HSK 风格的“补全汉字”题：每题给出一个词语（或单字），其中一个易拆解的合体字只显示一部分（偏旁部首或外框），学生从选项里选出缺失的完整部件，把字补完整。
${vocabPart}

【课文语料】
${corpus || '（无课文）'}

【极重要出题规则（繁简体统一遵循：易拆才拆、宁缺毋滥、能拆尽拆）】
1. **原样保留字形（支持纯简体、纯繁体及繁简混合）**：
   - word 必须与输入词汇完全一致！词汇本身是简体就按简体字形拆分，词汇本身是繁体就按繁体字形拆分（如“點”是黑+占，简体“点”是占+灬；“頭”是豆+頁，简体“头”不可拆；“隻”是隹+又；“節”是竹+即；“進”是辶+隹；“髮”是髟+友→改拆“頭”更清晰，若词是“頭髮”因髟字体易残缺可不拆“髮”，若词是“抬起來”可拆“抬=扌+台”或“起=走+己”）。
2. **只允许拆解以下四类「容易拆解且部件清晰」的汉字**：
   - ① 偏旁部首组合；② 左右结构；③ 上下结构；④ 清晰半包围结构（外框偏旁 + 内部常见独立汉字）。
   - **严格禁止硬拆**：独体字、笔画穿插字、复杂不可拆字（如：井、面、興、半、事、文、川、表、示、學、覺、舉、寫、樂、幾、機、為、無、與、裏/裡、農、軍 等），遇到不能拆或部件生僻/字体易显示不全（如 訁、釒、飠、糹、𦥑、舄、髟）的字，跳过该字（多字词若还有其他易拆字，改拆词里另一个易拆字；若整词都无易拆字则跳过该词）。
   - 常见拆字参考：
     · 左右/偏旁：秋=禾+火；晚=日+免；掉=扌+卓；拉=扌+立；放=方+攵；抬=扌+台；頭=豆+頁；漂=氵+票；肚=月+土；們=亻+門；現=王+見；站=立+占（不能写佔）；點=黑+占；時=日+寺；媽=女+馬；漢=氵+又；什=亻+十；故=古+攵；咬=口+交；演=氵+寅；许=讠+午；语=讠+吾；请=讠+青。
     · 上下结构：隻=隹+又；亮=亠+几（不拆，改拆“漂亮”中的“漂=氵+票”）；最=日+取；節=竹+即；点=占+灬；爸=父+巴；歲=山+夕；男=田+力；字=宀+子；家=宀+豕；安=宀+女；早=日+十；星=日+生。
     · 半包围结构（外框作 visible 且 position="natural"，内部完整汉字作 missing）：痛=疒+甬；病=疒+丙；店=广+占；房=户+方；這=辶+言；这=辶+文；遠=辶+袁；远=辶+元；近=辶+斤；進=辶+隹；进=辶+井；送=辶+关；過=辶+寸；間=門+日；间=门+日；問=門+口；问=门+口；聞=門+耳；闻=门+耳；趣=走+取；起=走+己。
3. **visible（题目中保留显示的部分）必须是完整、有辨识度的偏旁、部首或外框**，绝不能是孤立的单笔画或零碎笔形（严禁出现“一”“丨”“丶”“丿”“丷”“亠”“冖”作为 visible）！
4. **missing（缺失让学生选的部件）必须是完整、独立的常见汉字或部件，且与 visible 严格拼成 char，多一笔少一笔都不行**！
5. position：visible 在这个汉字方格里的位置，只能是下面之一：
   natural = visible 是 亻 氵 讠 扌 忄 礻 衤 刂 阝 禾 方 月 竹 豆 等侧边/上下偏旁，或 辶 門 门 疒 广 户 走 囗 匚 等半包围外框，原样显示
   left / right = visible 在左半边 / 右半边
   top / bottom = visible 在上半部分 / 下半部分
6. en：整个词语的简短英文释义。
7. 另外单独给一道最简单的示范题 example（固定用“什么”）。
8. distractors：再给 2~3 个干扰部件，要常见、容易混淆，且不能和 visible 组成题中汉字。
9. 只输出 JSON，不要任何解释，格式如下：
{"example":{"word":"什么","char":"什","visible":"亻","missing":"十","position":"natural","en":"what"},"items":[{"word":"秋天","char":"秋","visible":"禾","missing":"火","position":"left","en":"autumn"},{"word":"頭痛","char":"痛","visible":"疒","missing":"甬","position":"natural","en":"headache"}],"distractors":["口","马","子"]}`;

                    const raw = await callAI(prompt, '你是一个严谨的国际中文命题专家，精通汉字结构（偏旁部首、左右、上下、半包围结构）。严格原样保留输入的简体或繁体字形，给出且能拆解的词汇全部出题，不限制题数，不能拆的字不硬拆。只输出 JSON。', null, false);
                    const data = parseAIJson(raw);

                    if (!ex) {
                        ex = normRadicalItem(cleanItem(data.example)) || defaultEx;
                    }

                    (data.items || []).map(cleanItem).map(normRadicalItem).filter(Boolean).forEach(it => {
                        if (testedWords.has(it.word)) return; // 同一词汇只测一次；不同词汇即使有同字也全部出题
                        testedWords.add(it.word);
                        items.push(it);
                    });

                    if (Array.isArray(data.distractors)) {
                        rawDistractors.push(...data.distractors);
                    }
                }

                if (!items.length) throw new Error('当前词汇中没有适合安全拆分的合体字（复杂或不易拆解的汉字已自动跳过以避免出错），请更换词汇或重试一次。');

                const missingSet = [];
                [ex].concat(items).filter(Boolean).forEach(o => { if (!missingSet.includes(o.missing)) missingSet.push(o.missing); });
                const extras = Array.from(new Set(rawDistractors
                    .map(s => String(s).trim())
                    .filter(s => s && Array.from(s).length === 1 && !BAD_FRAGMENTS.has(s) && !missingSet.includes(s))));
                const total = Math.max(6, missingSet.length);
                const opts = missingSet.concat(extras.slice(0, Math.max(0, total - missingSet.length)))
                    .sort(() => Math.random() - 0.5);
                const letter = c => String.fromCharCode(65 + opts.indexOf(c));

                let html = `<div class="wp-exam">`;
                html += `<h2>🧩 补全汉字 (Complete the Characters)</h2>`;
                html += `<div class="wp-tip">Choose the correct component from A–${String.fromCharCode(64 + opts.length)} to complete each character, and write the letter in the box.</div>`;
                html += `<div class="wp-opts">${opts.map((c, i) => `<span><b>${String.fromCharCode(65 + i)}</b>${escapeHtml(c)}</span>`).join('')}</div>`;

                if (ex) {
                    const py = getPinyinArray(ex.word);
                    html += `<div class="wp-ex-label">例如：</div>`;
                    html += `<div class="wp-gitem"><div class="wp-gleft"><span class="wp-gcol">${buildGridGroup(ex.word, py, ex.idx, ex.visible, ex.position, false)}<span class="wp-gen">${escapeHtml(ex.en)}</span></span><span class="wp-arrow"></span>${buildGridGroup(ex.word, py, ex.idx, ex.visible, ex.position, true)}</div><div class="wp-abox">${letter(ex.missing)}</div></div>`;
                }

                const answers = [];
                items.forEach((o, i) => {
                    const no = EXAM_START_NO + i;
                    const py = getPinyinArray(o.word);
                    answers.push(`${no}. ${letter(o.missing)}（${o.missing}）— ${o.word}`);
                    html += `<div class="wp-gitem"><div class="wp-gleft"><span class="wp-no">${no}.</span><span class="wp-gcol">${buildGridGroup(o.word, py, o.idx, o.visible, o.position, false)}<span class="wp-gen">${escapeHtml(o.en)}</span></span></div><div class="wp-abox"></div></div>`;
                });

                html += ANSWER_TOGGLE;
                html += `<div class="wp-answer" style="display:none;">参考答案：<br>${answers.map(escapeHtml).join('<br>')}</div>`;
                html += `</div>`;
                appendExamToBoard(html);
            });
        });
    }

    window.clearPptFromBoard = function() {
        const whiteboard = document.getElementById('whiteboardContent');
        const pptNodes = whiteboard.querySelectorAll('.pptx-import');
        
        if (pptNodes.length === 0) {
            alert('白板上没有可清除的 PPT 内容。');
            return;
        }
        
        if (!confirm(`确定要从白板删除全部 ${pptNodes.length} 页 PPT 内容吗？\n（老师手写的其他内容会保留）`)) {
            return;
        }
        
        pptNodes.forEach(node => {
            let prev = node.previousSibling;
            while (prev && prev.nodeType === Node.TEXT_NODE && !prev.textContent.trim()) {
                prev = prev.previousSibling;
            }
            if (prev && prev.tagName === 'HR') {
                const beforeHr = prev.previousSibling;
                prev.remove();
                if (beforeHr && beforeHr.nodeName === 'BR') beforeHr.remove();
            }
            node.remove();
        });
        
        const fileInput = document.getElementById('docFileUpload');
        const fileNameEl = document.getElementById('docFileName');
        if (fileInput) fileInput.value = '';
        if (fileNameEl) fileNameEl.textContent = '未选择文件';
        
        if (!whiteboard.innerText.trim()) {
            whiteboard.innerHTML = '<p><br></p>';
        }
        
        if (typeof window.__wbSaveHistory === 'function') window.__wbSaveHistory();
        setTimeout(() => {
            if (typeof window.__wbResizeCanvas === 'function') window.__wbResizeCanvas();
        }, 100);
        
        alert('✅ 已清除白板上的 PPT 内容。');
    };
</script>
</body>
</html>
